basePath: /
definitions:
  dto.BCVCaptureResponse:
    properties:
      eur:
        example: 848.8258
        type: number
      fecha:
        example: "2026-07-30"
        type: string
      status:
        example: updated
        type: string
      usd:
        example: 745.6371
        type: number
    type: object
  dto.BCVHistoricoResponse:
    properties:
      eur:
        example: 39.1234
        type: number
      fecha:
        example: "2024-05-15"
        type: string
      usd:
        example: 36.4521
        type: number
    type: object
  dto.BCVResponse:
    properties:
      eur:
        example: 39.1234
        type: number
      fecha:
        example: "2026-03-20T00:00:00Z"
        type: string
      usd:
        example: 36.4521
        type: number
    type: object
  dto.CodigoAreaResponse:
    properties:
      codigo:
        example: "0412"
        type: string
      id:
        example: 1
        type: integer
    type: object
  dto.CiudadResponse:
    properties:
      estado_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      nombre:
        example: Barquisimeto
        type: string
    type: object
  dto.CreateUCAUURequest:
    properties:
      valor:
        description: validate:"required,gt=0" asegura que el campo venga y sea mayor
          a cero
        example: 35.5
        type: number
    required:
    - valor
    type: object
  dto.EstadoResponse:
    properties:
      id:
        example: 1
        type: integer
      nombre:
        example: Lara
        type: string
    type: object
  dto.GenericResponse:
    properties:
      data: {}
      message:
        example: Operación exitosa
        type: string
    type: object
  dto.MunicipioResponse:
    properties:
      estado_id:
        example: 1
        type: integer
      id:
        example: 10
        type: integer
      nombre:
        example: Iribarren
        type: string
    type: object
  dto.ParroquiaResponse:
    properties:
      id:
        example: 50
        type: integer
      municipio_id:
        example: 10
        type: integer
      nombre:
        example: Catedral
        type: string
    type: object
  dto.TribunalResponse:
    properties:
      categoria:
        example: Superior
        type: string
      id:
        example: 1
        type: integer
      nombre:
        example: Corte de Apelaciones Sala 1
        type: string
    type: object
  dto.UCAUUResponse:
    properties:
      fecha:
        example: "2026-03-20T10:00:00Z"
        type: string
      valor:
        example: 35.5
        type: number
    type: object
info:
  contact:
    name: Jose
  description: API centralizada para indicadores económicos y territoriales.
  title: API Global Universitas
  version: "1.0"
paths:
  /api/v1/economia/bcv:
    get:
      description: Retorna el valor actual del Dólar y Euro oficial.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.BCVResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener tasas del BCV (Dólar y Euro)
      tags:
      - Economia
  /api/v1/economia/bcv/capturar:
    post:
      description: Scrapea el BCV y guarda o actualiza USD/EUR del día (Caracas). Requiere
        header X-Cron-Secret. Pensado para Cloud Scheduler con Cloud Run min=0.
      parameters:
      - description: Secreto compartido con Cloud Scheduler
        in: header
        name: X-Cron-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.BCVCaptureResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Capturar tasas BCV (cron / Cloud Scheduler)
      tags:
      - Economia
  /api/v1/economia/bcv/historico:
    get:
      description: Retorna USD y EUR del BCV para una fecha específica desde la base
        de datos (sin scrapeo). Pensado para el calendario del frontend.
      parameters:
      - description: Fecha a consultar (YYYY-MM-DD)
        example: "2024-05-15"
        in: query
        name: fecha
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.BCVHistoricoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener tasa BCV por fecha
      tags:
      - Economia
  /api/v1/economia/ucauu:
    get:
      description: Retorna el último valor registrado de la unidad UCAUU
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UCAUUResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener última UCAUU
      tags:
      - Economia
    post:
      consumes:
      - application/json
      description: Permite registrar el valor de la UCAUU del día actual. Si ya existe,
        lo actualiza.
      parameters:
      - description: Valor de la UCAUU
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUCAUURequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Registrar o Actualizar UCAUU
      tags:
      - Economia
  /api/v1/territorio/codigos-area:
    get:
      description: Retorna la lista de códigos de área telefónicos de Venezuela
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CodigoAreaResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener códigos de área
      tags:
      - Territorio
  /api/v1/territorio/estados:
    get:
      description: Retorna la lista de todos los estados de Venezuela
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.EstadoResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener todos los estados
      tags:
      - Territorio
  /api/v1/territorio/estados/{estado_id}/ciudades:
    get:
      description: Retorna la lista de ciudades pertenecientes a un estado específico
      parameters:
      - description: ID del Estado
        in: path
        name: estado_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CiudadResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener ciudades por estado
      tags:
      - Territorio
  /api/v1/territorio/estados/{estado_id}/municipios:
    get:
      description: Retorna la lista de municipios pertenecientes a un estado específico
      parameters:
      - description: ID del Estado
        in: path
        name: estado_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.MunicipioResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener municipios por estado
      tags:
      - Territorio
  /api/v1/territorio/estados/{estado_id}/tribunales:
    get:
      description: Retorna la lista de tribunales de categoría Superior y Primera
        Instancia pertenecientes a un estado
      parameters:
      - description: ID del Estado
        in: path
        name: estado_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.TribunalResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener tribunales estadales por estado
      tags:
      - Territorio
  /api/v1/territorio/municipios/{municipio_id}/parroquias:
    get:
      description: Retorna la lista de parroquias pertenecientes a un municipio específico
      parameters:
      - description: ID del Municipio
        in: path
        name: municipio_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ParroquiaResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener parroquias por municipio
      tags:
      - Territorio
  /api/v1/territorio/municipios/{municipio_id}/tribunales:
    get:
      description: Retorna la lista de tribunales de categoría Municipio asociados
        a un municipio específico, incluyendo los compartidos con otros municipios
      parameters:
      - description: ID del Municipio
        in: path
        name: municipio_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.GenericResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.TribunalResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.GenericResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.GenericResponse'
      summary: Obtener tribunales municipales por municipio
      tags:
      - Territorio
swagger: "2.0"
