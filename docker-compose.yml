version: '3.8'

services:
  # Servicio 1: Nuestra API en Go
  api:
    build: .
    container_name: api-global-backend
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # Inyecta todas las variables del archivo .env automáticamente
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - universitas-net

  # Servicio 2: Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: universitas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-universitas_db}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - universitas-net

# Definición de red para los contenedores (por si a futuro agregas Redis u otro servicio)
networks:
  universitas-net:
    driver: bridge